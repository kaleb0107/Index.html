<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Por Mais Uma Vida</title>

<style>
body {
  background: #0b1220;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
}
h1 { text-align: center; }
.card {
  background: #111a2e;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}
input, textarea, button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}
button {
  background: #5a5cff;
  color: white;
  font-size: 16px;
}
.like {
  cursor: pointer;
}
small {
  color: #aaa;
}
</style>
</head>

<body>

<h1>Por Mais Uma Vida</h1>
<p style="text-align:center">Você não precisa ser forte aqui.</p>

<div class="card">
  <input id="nome" placeholder="Seu nome (opcional)">
  <textarea id="texto" placeholder="Escreva seu desabafo..."></textarea>
  <button onclick="publicar()">Desabafar</button>
</div>

<div id="lista"></div>

<p style="margin-top:30px; text-align:center; font-size:12px;">
Se estiver em risco imediato, ligue <b>188 (CVV)</b><br>
Desenvolvido por Kaleb Matos
</p>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZSFGunkDsK8m3EowBLY9d2nEDZva5Is4",
  authDomain: "por-mais-uma-vida.firebaseapp.com",
  projectId: "por-mais-uma-vida",
  storageBucket: "por-mais-uma-vida.firebasestorage.app",
  messagingSenderId: "909230295729",
  appId: "1:909230295729:web:f0a6a2775ff84e4f63b090"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "desabafos");

window.publicar = async () => {
  const nome = document.getElementById("nome").value || "Anônimo";
  const texto = document.getElementById("texto").value.trim();
  if (!texto) return alert("Escreva algo.");

  await addDoc(col, {
    nome,
    texto,
    likes: 0,
    criadoEm: serverTimestamp()
  });

  document.getElementById("texto").value = "";
};

function tempo(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - ts.toMillis()) / 1000);
  if (s < 60) return "agora";
  if (s < 3600) return `há ${Math.floor(s/60)} min`;
  if (s < 86400) return `há ${Math.floor(s/3600)} h`;
  return `há ${Math.floor(s/86400)} dias`;
}

const q = query(col, orderBy("criadoEm", "desc"));
onSnapshot(q, snap => {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  snap.forEach(d => {
    const x = d.data();
    lista.innerHTML += `
      <div class="card">
        <small>${x.nome} • ${tempo(x.criadoEm)}</small>
        <p>${x.texto}</p>
        <span class="like" onclick="like('${d.id}')">❤️ ${x.likes}</span>
      </div>
    `;
  });
});

window.like = async (id) => {
  await updateDoc(doc(db, "desabafos", id), {
    likes: increment(1)
  });
};
</script>

</body>
</html>
